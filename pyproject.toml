[project]
name = "chopper"
version = "0.1.0"
description = "Chop tracks into slices, drum kits and sound bits — with built-in stem separation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "audioread>=3.0",  # decoding fallback for formats libsndfile can't read (needs ffmpeg)
]

[project.optional-dependencies]
# Stem separation (UVR models via audio-separator). Pulls in PyTorch.
# scripts/run.py install picks the right one (and a CUDA build of PyTorch for NVIDIA).
separation = ["audio-separator[cpu]>=0.30"]      # CPU, and Apple Silicon GPU (Metal)
separation-cuda = ["audio-separator[gpu]>=0.30"]  # NVIDIA GPUs
separation-directml = ["audio-separator[dml]>=0.30"]  # AMD / Intel GPUs on Windows (experimental)
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chopper = "chopper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
